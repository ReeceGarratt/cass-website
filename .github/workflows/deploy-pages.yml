# Interim preview on GitHub Pages (D-019). Production hosting is Cloudflare
# Workers (D-009); delete this workflow once that pipeline exists (Q-009).
name: Deploy preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read # configure-pages reads the site URL from the Pages API
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Get Pages URL and base path
        id: pages
        uses: actions/configure-pages@v6

      # Pages serves a project site under /<repo>/, so pass the base path to
      # Astro here rather than in astro.config.mjs; local builds stay at the
      # root. base_path is empty if a custom domain is added.
      - name: Build
        run: npm run build -- --site "$SITE_URL" --base "${BASE_PATH:-/}"
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
